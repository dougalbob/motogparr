name: Release

# Turns a version tag into a GitHub release with notes generated from the
# merged pull requests since the previous tag, and writes the same text to
# RELEASE_NOTES_v<version>.md so the notes live in the repository too.
#
# Why generated: the previous three releases were written by hand, which took an
# hour each and drifted from what the commits actually did. Labels on PRs are the
# only input (see .github/release.yml), so the notes cannot quietly omit a change
# that was labelled.
#
# Anything genuinely worth explaining - a migration step, a behaviour change -
# belongs in the PR description and will appear in the "Other changes" /
# category list. This workflow does not invent prose.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)generate notes for, e.g. v2.5.0'
        required: true

permissions:
  contents: write     # to commit the notes file to a branch
  pull-requests: write  # to open/update the release-notes pull request

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags are needed to find the previous release

      - name: Resolve the tag and version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The tag format matters: docker-publish.yml derives :2.5 and :latest from
      # a semver tag. "V.2.2.1" silently produced no 2.2 tag, which is why this
      # check exists rather than a comment saying "use semver".
      - name: Require a vX.Y.Z tag
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad tag format::'$tag' is not vX.Y.Z."
            echo "The container workflow derives :MAJOR.MINOR and :latest from"
            echo "semver tags; 'V.2.2.1' did not, and shipped untagged images."
            exit 1
          fi

      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ steps.version.outputs.tag }}"
          # Tags are listed newest first, so the first one that is not the tag
          # being released is the previous release.
          previous=$(gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | grep -vx "$current" | head -1 || true)
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"
          if [ -z "$previous" ]; then
            echo "No earlier release; notes will list all merged pull requests."
          else
            echo "Generating notes since ${previous}"
          fi

      - name: Generate notes from merged pull requests
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # generate-notes is POST, and takes JSON fields - gh api defaults to
          # GET and its own naming, so both have to be explicit here.
          args=(
            --method POST
            "repos/${{ github.repository }}/releases/generate-notes"
            -f "tag_name=${{ steps.version.outputs.tag }}"
            -f "configuration_file_path=.github/release.yml"
          )
          if [ -n "${{ steps.previous.outputs.tag }}" ]; then
            args+=(-f "previous_tag_name=${{ steps.previous.outputs.tag }}")
          fi

          gh api "${args[@]}" --jq .body > generated_notes.md

          # A release with an empty body usually means every PR was unlabelled or
          # excluded. Say so instead of publishing a blank page.
          if [ ! -s generated_notes.md ]; then
            echo "::warning title=Empty release notes::No pull requests matched. Check PR labels."
          fi

          echo "--- generated ---"
          head -40 generated_notes.md

      - name: Write the notes into the repository
        run: |
          file="RELEASE_NOTES_v${{ steps.version.outputs.version }}.md"
          {
            echo "# MotoGParr ${{ steps.version.outputs.tag }}"
            echo
            cat generated_notes.md
            echo
            echo "---"
            echo
            echo "_Generated from merged pull requests. Container image:_"
            echo "\`ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}\`"
          } > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
        id: writeup

      # Commit the notes file to a release-notes branch and propose it to main
      # through a pull request. main itself is never touched directly, and the
      # branch/PR is updated in place on re-runs (no force-push).
      - name: Commit release notes to a release-notes branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release-notes/v${{ steps.version.outputs.version }}"
          file="RELEASE_NOTES_v${{ steps.version.outputs.version }}.md"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git fetch origin main >/dev/null 2>&1 || true
          # Fetch the release-notes branch from a previous run. Without this,
          # a re-run creates a new branch from origin/main and the push is
          # rejected as non-fast-forward, which is how the v2.7.0 re-run
          # failed after the permission was fixed.
          if git fetch origin "$branch" >/dev/null 2>&1; then
            git checkout -B "$branch" FETCH_HEAD
            git merge --ff-only origin/main 2>/dev/null || true
          else
            git checkout -B "$branch" origin/main
          fi

          git add "$file"
          git commit -m "Add $file" >/dev/null 2>&1 || true   # no-op when unchanged
          # Do not swallow a push failure: if the branch does not reach the
          # remote, the PR step below cannot open a pull request, and a green
          # job with no PR is the exact failure this workflow exists to
          # prevent. Pushing an existing, up-to-date branch is a no-op.
          git push origin "$branch"

      - name: Open or update the release-notes pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release-notes/v${{ steps.version.outputs.version }}"
          version="${{ steps.version.outputs.version }}"
          title="Add release notes RELEASE_NOTES_v${version}.md"
          body="$(cat <<EOF
          Proposes adding `RELEASE_NOTES_v${version}.md` to `main`.

          The release notes were generated from merged pull requests and are
          also attached to the release. The same file is committed to branch
          `release-notes/v${version}` and proposed here; re-running this
          workflow updates the branch and this PR in place (no force-push).

          Verification: this workflow is exercised on a real tag push, which
          is the maintainer's action - it cannot be exercised from a PR run.
          EOF
          )"
          existing=$(gh pr list --head "$branch" --base main --json number --jq '.[].number' | head -1)
          if [ -n "$existing" ]; then
            echo "Updating existing PR #$existing"
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            echo "Creating new PR"
            gh pr create --title "$title" --body "$body" --head "$branch" --base main
          fi

          # Verify the pull request actually exists. v2.6.0 and v2.5.6 both
          # had a green job with no release-notes PR because the failure was
          # swallowed; this check makes that impossible to miss.
          if [ -z "$(gh pr list --head "$branch" --base main --json number --jq '.[0].number')" ]; then
            echo "::error title=Release-notes PR missing::No pull request from $branch to main."
            echo "The notes file is on branch $branch; open the pull request manually."
            exit 1
          fi
          echo "Release-notes pull request is open for $branch"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; updating its notes."
            gh release edit "$tag" --notes-file generated_notes.md
          else
            gh release create "$tag" \
              --title "MotoGParr $tag" \
              --notes-file generated_notes.md \
              --verify-tag
          fi

      - name: Upload the notes file as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-notes-${{ steps.version.outputs.version }}
          path: RELEASE_NOTES_v*.md
          retention-days: 30

      # The release body and the in-repo file are both the generated notes.
      # No hand-written companion is concatenated: a second file would be a
      # second source of truth and can drift. (The v2.5.0 manual merge of
      # generated notes + hand-written guide was a one-time migration.)
      - name: Explain where the file went
        run: |
          {
            echo "## Release ${{ steps.version.outputs.tag }} published"
            echo
            echo "Notes generated from merged pull requests and attached to the release."
            echo
            echo "A copy named \`${{ steps.writeup.outputs.file }}\` is attached to this"
            echo "The same file (\\`${{ steps.writeup.outputs.file }}\\`) is committed to"
            echo "branch \\`release-notes/v${{ steps.version.outputs.version }}\\` and proposed"
            echo "to \\`main\\` via a pull request, so the notes reach the repository"
            echo "without pushing to a protected branch directly. It is also attached to"
            echo "this workflow run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"
